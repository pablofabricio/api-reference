services:
  app:
    build:
        context: ./docker/php
    container_name: api-reference-php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - db
    networks:
      api-reference:
        aliases:
          - php-fpm

  webserver:
    image: nginx:alpine
    container_name: api-reference-nginx
    restart: unless-stopped
    ports:
      - "8000:81"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - api-reference
    depends_on:
      - app

  db:
    image: postgres:14
    container_name: api-reference-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: api_reference
      POSTGRES_USER: api-user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - db:/var/lib/postgresql/data
    networks:
      - api-reference

  minio:
    image: minio/minio:latest
    container_name: api-reference-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - api-reference

  minio-init:
    image: minio/mc:latest
    container_name: api-reference-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin) do echo '...waiting for minio...' && sleep 1; done;
      /usr/bin/mc mb --ignore-existing local/reference-app;
      /usr/bin/mc anonymous set public local/reference-app;
      exit 0;
      "
    networks:
      - api-reference

networks:
  api-reference:
    driver: bridge
    ipam:
      config:
        - subnet: 172.40.0.0/24

volumes:
  db:
    driver: local
  app-data:
    driver: local
  minio-data:
    driver: local