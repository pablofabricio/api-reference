version: '3.8'

services:
  app:
    build:
      context: ./docker/php
    container_name: api-migrations-php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      - mongodb
    networks:
      api-migrations:
        aliases:
          - php-fpm
    environment:
      DB_CONNECTION: mongodb
      DB_HOST: mongodb
      DB_PORT: 27017
      DB_DATABASE: migrations
      DB_USERNAME: root
      DB_PASSWORD: root

  webserver:
    image: nginx:alpine
    container_name: api-migrations-nginx
    restart: unless-stopped
    ports:
      - "8000:81"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - api-migrations
    depends_on:
      - app

  mongodb:
    image: mongo:6
    container_name: api-migrations-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root
      MONGO_INITDB_DATABASE: migrations
    ports:
      - "27017:27017"
    volumes:
      - mongodbdata:/data/db
    networks:
      - api-migrations

networks:
  api-migrations:
    driver: bridge

volumes:
  mongodbdata:
  app-data:
    driver: local
